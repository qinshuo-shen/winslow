[project]
name = "procrastination-tool"
version = "0.1.0"
description = "Personal Notion -> macOS Calendar sync, focus timer, and spin-wheel reward tool."
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0",
    "notion-client>=2.2",
]

[project.optional-dependencies]
# Only the dashboard needs this -- the LaunchAgent-driven background
# automation (sync_tasks.py, smoke_test.py) and the `focus` CLI don't.
dashboard = ["streamlit>=1.30"]

[project.scripts]
focus = "procrastination_tool.focus_cli:main"

[tool.setuptools.packages.find]
include = ["procrastination_tool*"]
