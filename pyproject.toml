[project]
name = "winslow"
version = "0.1.0"
description = "Winslow -- personal task board, focus timer, and calendar integration (formerly procrastination-tool)."
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0",
    "notion-client>=2.2",
]

[project.optional-dependencies]
# Only the dashboard needs this -- the LaunchAgent-driven background
# automation (sync_tasks.py, smoke_test.py) and the `focus` CLI don't.
dashboard = ["streamlit>=1.30", "streamlit-sortables>=0.3.1"]

# Phase 1 of the Streamlit -> React+FastAPI migration: the new read-only
# `api/` package (sibling to procrastination_tool/ and app.py) that the
# React frontend calls. Doesn't touch the `dashboard` group above -- app.py
# stays on disk, untouched, same fallback convention as spin_wheel.py.
#
# Multi-user follow-up: bcrypt is a hard dependency of this extra (not its
# own lazily-imported extra like `push`/`ai`) because password hashing is
# load-bearing for every request once auth exists, not an optional feature
# a deployment might skip.
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.0", "bcrypt>=4.0"]

# Scrum-lite AI PM-agent (backlog review suggestions) -- optional, same
# reasoning as the other groups: only procrastination_tool/pm_agent.py
# needs this, everything else runs fine without it (PM_AGENT_MOCK=1 dev
# iteration needs no API key or this dependency at all).
ai = ["anthropic>=0.40"]

# Web Push notifications for the focus timer (see push_notifications.py) --
# only that module needs this, lazily imported inside send_to_all(), same
# pattern as the `ai` extra above. Pinned to 2.1.2, NOT the current PyPI
# latest (2.4.0): pywebpush >=2.2.0 requires Python >=3.10, and this
# project's venv is 3.9 (see requires-python above). 2.1.2's webpush()/
# WebPushException API is verified identical to current -- zero API risk
# in staying pinned.
push = ["pywebpush==2.1.2", "py-vapid>=1.7.0"]

[project.scripts]
focus = "procrastination_tool.focus_cli:main"

[tool.setuptools.packages.find]
include = ["procrastination_tool*"]
